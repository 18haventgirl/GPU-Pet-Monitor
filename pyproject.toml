[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-pet-monitor"
version = "1.0.0"
description = "A cute desktop pet that monitors your NVIDIA GPU"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "nvidia-ml-py>=12.0.0",
    "PyQt5>=5.15.0",
]

[project.scripts]
gpu-pet-monitor = "src.main:main"

[tool.setuptools.package-dir]
"" = "src"
